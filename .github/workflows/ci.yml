name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Environment versions
        run: |
          node --version
          npm --version
          java -version
      - run: npm ci --include=dev
      - name: Documentation integrity
        run: npm run docs:check
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
      - name: Auth and Firestore integration tests
        run: npm run test:integration
      - name: Chromium for critical browser journeys
        run: npx playwright install --with-deps chromium
      - name: Critical Gika commands, confirmation and recovery
        run: npm run test:e2e:critical
      - name: All-day reminders and compact color controls
        run: npm run test:e2e:local -- all-day-colors.spec.ts gika-notifications.spec.ts recurrence-options.spec.ts
      - name: Responsive navigation, content and public pages
        run: npm run test:e2e:local -- mobile-refinement.spec.ts public-pages.spec.ts gika-launcher.spec.ts agenda-loading.spec.ts visual-polish.spec.ts today-date-clarity.spec.ts
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
