name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - name: Environment versions
        run: |
          node --version
          npm --version
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
