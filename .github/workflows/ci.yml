name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Environment versions
        run: |
          node --version
          npm --version
          java -version
      - run: npm ci --include=dev
      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        run: npm run build
      - name: Auth and Firestore integration tests
        run: npm run test:integration
      - name: Chromium for critical browser journeys
        run: npx playwright install --with-deps chromium
      - name: Critical Gika commands, confirmation and recovery
        run: npm run test:e2e:critical
      - name: Responsive navigation, content and public pages
        run: npm run test:e2e:local -- mobile-refinement.spec.ts public-pages.spec.ts gika-launcher.spec.ts agenda-loading.spec.ts
      - name: Browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
