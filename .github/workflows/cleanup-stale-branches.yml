name: Cleanup stale merged branches

on:
  push:
    branches:
      - feat/responsive-shell-v2
    paths:
      - .github/workflows/cleanup-stale-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Delete verified stale branches
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            "feat/calendar-planner-safe"
            "feat/daily-checklist-ux"
            "feat/practical-microcopy-pass"
            "feat/seasonal-calendar-markers"
            "feat/seasonal-experiences-safe"
            "feat/ux-cohesion-pass"
            "fix/all-day-activity-progress"
            "fix/completed-state-and-calendar-label"
            "fix/mobile-activity-card-layout"
            "fix/mobile-commitment-card"
            "fix/mobile-page-heading-alignment"
            "fix/pwa-release-refresh"
            "refine/seasonal-calendar-markers"
          )

          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting $branch"
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
