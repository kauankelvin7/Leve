name: Planner E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/src/features/activities/Calendar.tsx'
      - 'apps/web/src/features/activities/Today.tsx'
      - 'apps/web/src/features/activities/calendar/**'
      - 'apps/web/src/platform/api.ts'
      - 'apps/web/src/platform/outbox.ts'
      - 'apps/web/src/platform/theme.ts'
      - 'apps/web/src/styles/**'
      - 'packages/domain/src/content.ts'
      - 'packages/domain/src/identity.ts'
      - 'packages/domain/src/themes.ts'
      - 'server/commands/content.ts'
      - 'scripts/dev-local.mjs'
      - 'tests/e2e-local/calendar-planner*.spec.ts'
      - '.github/workflows/planner-e2e.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/src/features/activities/Calendar.tsx'
      - 'apps/web/src/features/activities/Today.tsx'
      - 'apps/web/src/features/activities/calendar/**'
      - 'apps/web/src/platform/api.ts'
      - 'apps/web/src/platform/outbox.ts'
      - 'apps/web/src/platform/theme.ts'
      - 'apps/web/src/styles/**'
      - 'packages/domain/src/content.ts'
      - 'packages/domain/src/identity.ts'
      - 'packages/domain/src/themes.ts'
      - 'server/commands/content.ts'
      - 'scripts/dev-local.mjs'
      - 'tests/e2e-local/calendar-planner*.spec.ts'
      - '.github/workflows/planner-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planner-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --include=dev
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Planner authenticated E2E on isolated emulators
        shell: bash
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/leve-planner-dev.log"
          LEVE_EPHEMERAL=true node scripts/dev-local.mjs >"$LOG_FILE" 2>&1 &
          DEV_PID=$!

          cleanup() {
            kill "$DEV_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 120); do
            if curl --fail --silent --show-error http://localhost:5174/entrar >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:9099/emulator/v1/projects/demo-leve/config >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$DEV_PID" 2>/dev/null; then
              echo "O ambiente local encerrou antes de ficar pronto."
              cat "$LOG_FILE"
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" != true ]; then
            echo "O ambiente local não ficou pronto dentro de 120 segundos."
            cat "$LOG_FILE"
            exit 1
          fi

          LEVE_LOCAL_URL=http://localhost:5174 npm run test:e2e:local -- \
            tests/e2e-local/calendar-planner.spec.ts \
            tests/e2e-local/calendar-planner-visual.spec.ts
