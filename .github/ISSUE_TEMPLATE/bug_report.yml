name: Relatar bug
description: Informe um comportamento incorreto ou regressão reproduzível.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o Leve. Não publique tokens, chaves, dados pessoais ou detalhes de vulnerabilidades aqui. Para falhas de segurança, use SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: O que você esperava?
      description: Descreva o comportamento esperado.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Como reproduzir
      description: Liste os passos mínimos para reproduzir o problema.
      placeholder: |
        1. Abra...
        2. Faça...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      options:
        - Aplicação publicada
        - Ambiente local
        - Preview
        - Outro
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Contexto adicional
      description: Navegador, dispositivo, screenshots sem dados sensíveis ou outras informações úteis.
