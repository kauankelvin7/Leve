version: 1
project: gika
source_of_truth: true

status_values:
  - todo
  - in_progress
  - blocked
  - done

rules:
  - "Apenas uma tarefa mutável pode estar in_progress no mesmo conjunto de arquivos."
  - "done exige acceptance_criteria + evidence + checkpoint."
  - "Toda tarefa concluída atualiza GIKA_STATE.md no mesmo commit."
  - "Não iniciar tarefa com dependência não concluída."

milestones:
  M0:
    name: "Auditoria e arquitetura factual"
    status: done
    evidence: "docs/gika/M0_EVIDENCE.md; cinco commits atômicos M0-T1..M0-T5 e gates baseline aprovados."
    gate: "Nenhuma feature de produção é implementada."
    tasks:
      - id: M0-T1
        title: "Mapear repositório e comandos de qualidade"
        status: done
        evidence:
          - "docs/gika/ARCHITECTURE.md: stack, scripts, entradas, base SHA e status; M0_EVIDENCE.md: lint/build/typecheck e 93 unit PASS."
        dependencies: []
        owner: auditor
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Stack, scripts, diretórios e entrypoints documentados."
          - "Comandos reais de test/lint/typecheck/build identificados."
          - "SHA e git status registrados."
      - id: M0-T2
        title: "Mapear domínio da agenda"
        status: done
        evidence:
          - "ARCHITECTURE.md: schemas reais Activity/Category/series e rastreio create/update/setStatus/reschedule/trash; evidências M0-T2."
        dependencies: [M0-T1]
        owner: domain-auditor
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Schemas de tarefa, rotina, recorrência e categorias documentados."
          - "Fluxos create/update/complete/reschedule/delete rastreados."
          - "Sem suposições não verificadas."
      - id: M0-T3
        title: "Mapear auth, persistência, offline e outbox"
        status: done
        evidence:
          - "ARCHITECTURE.md: auth/Rules/persistência/outbox e riscos verificados; M0_EVIDENCE.md: 28 integration PASS com emuladores."
        dependencies: [M0-T1]
        owner: platform-auditor
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Auth e regras de acesso documentadas."
          - "Persistência e sincronização documentadas."
          - "Riscos de idempotência/conflito identificados."
      - id: M0-T4
        title: "Mapear design system e navegação"
        status: done
        evidence:
          - "ARCHITECTURE.md: Shell/tokens/componentes/mobile/PWA reais e restrições de foco/timer; revisão documental M0-T4."
        dependencies: [M0-T1]
        owner: ui-auditor
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Shell, navegação, tokens e componentes reutilizáveis identificados."
          - "Restrições mobile/PWA/safe-area documentadas."
      - id: M0-T5
        title: "Fechar arquitetura concreta da Gika"
        status: done
        evidence:
          - "Contratos tipados/command bridge/policy matrix e ADRs 004-007; ExecPlan factual revisado; lint/typecheck/build, 93 unit e 28 integration PASS."
        dependencies: [M0-T2, M0-T3, M0-T4]
        owner: architect
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Contratos de tool calling definidos."
          - "Policy matrix definida."
          - "Plano de integração sem duplicar regras de negócio."
          - "Decisões relevantes registradas."

