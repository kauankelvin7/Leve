version: 1
project: gika
source_of_truth: true

status_values:
  - todo
  - in_progress
  - blocked
  - done

rules:
  - "Apenas uma tarefa mutável pode estar in_progress no mesmo conjunto de arquivos."
  - "done exige acceptance_criteria + evidence + checkpoint."
  - "Toda tarefa concluída atualiza GIKA_STATE.md no mesmo commit."
  - "Não iniciar tarefa com dependência não concluída."

milestones:
  M0:
    name: "Auditoria e arquitetura factual"
    status: done
    evidence: "docs/gika/M0_EVIDENCE.md; cinco commits atômicos M0-T1..M0-T5 e gates baseline aprovados."
    gate: "Nenhuma feature de produção é implementada."
    tasks:
      - id: M0-T1
        title: "Mapear repositório e comandos de qualidade"
        status: done
        evidence:
          - "docs/gika/ARCHITECTURE.md: stack, scripts, entradas, base SHA e status; M0_EVIDENCE.md: lint/build/typecheck e 93 unit PASS."
        dependencies: []
        owner: auditor
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Stack, scripts, diretórios e entrypoints documentados."
          - "Comandos reais de test/lint/typecheck/build identificados."
          - "SHA e git status registrados."
      - id: M0-T2
        title: "Mapear domínio da agenda"
        status: done
        evidence:
          - "ARCHITECTURE.md: schemas reais Activity/Category/series e rastreio create/update/setStatus/reschedule/trash; evidências M0-T2."
        dependencies: [M0-T1]
        owner: domain-auditor
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Schemas de tarefa, rotina, recorrência e categorias documentados."
          - "Fluxos create/update/complete/reschedule/delete rastreados."
          - "Sem suposições não verificadas."
      - id: M0-T3
        title: "Mapear auth, persistência, offline e outbox"
        status: done
        evidence:
          - "ARCHITECTURE.md: auth/Rules/persistência/outbox e riscos verificados; M0_EVIDENCE.md: 28 integration PASS com emuladores."
        dependencies: [M0-T1]
        owner: platform-auditor
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Auth e regras de acesso documentadas."
          - "Persistência e sincronização documentadas."
          - "Riscos de idempotência/conflito identificados."
      - id: M0-T4
        title: "Mapear design system e navegação"
        status: done
        evidence:
          - "ARCHITECTURE.md: Shell/tokens/componentes/mobile/PWA reais e restrições de foco/timer; revisão documental M0-T4."
        dependencies: [M0-T1]
        owner: ui-auditor
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Shell, navegação, tokens e componentes reutilizáveis identificados."
          - "Restrições mobile/PWA/safe-area documentadas."
      - id: M0-T5
        title: "Fechar arquitetura concreta da Gika"
        status: done
        evidence:
          - "Contratos tipados/command bridge/policy matrix e ADRs 004-007; ExecPlan factual revisado; lint/typecheck/build, 93 unit e 28 integration PASS."
        dependencies: [M0-T2, M0-T3, M0-T4]
        owner: architect
        mutation_scope: "docs only"
        acceptance_criteria:
          - "Contratos de tool calling definidos."
          - "Policy matrix definida."
          - "Plano de integração sem duplicar regras de negócio."
          - "Decisões relevantes registradas."

  M1:
    name: "Shell visual da Gika"
    status: done
    evidence: "M1_EVIDENCE.md: gates focais aprovados, refinements T4 e screenshots finais; falhas da regressão ampliada documentadas explicitamente."
    tasks:
      - id: M1-S0
        title: "Versionar humanizer-br local oficial"
        status: done
        dependencies: [M0-T5]
        owner: orchestrator
        mutation_scope: "skill e documentação"
        acceptance_criteria:
          - "Conteúdo fornecido pelo usuário versionado e lido integralmente."
          - "ADR e estado removem bloqueio externo sem alterar regras originais."
        evidence:
          - ".agent/skills/humanizer-br/SKILL.md lido integralmente; ADR-GIKA-008; revisão literal do conteúdo fornecido."
      - id: M1-T1
        title: "Botão flutuante e painel"
        status: done
        acceptance_criteria:
          - "Botão só no Shell autenticado; painel lazy com falha isolada."
          - "Modal com foco contido, Escape e retorno ao acionador; sem perda de rascunho/navegação."
          - "Mobile respeita navegação e safe area; texto demo explícito."
        evidence:
          - "M1_EVIDENCE.md: 2 E2E autenticados + Axe PASS; lint/build/typechecks e 93 unit PASS."
        dependencies: [M0-T5, M1-S0]
        owner: frontend
        mutation_scope: "UI Gika + testes"
      - id: M1-T2
        title: "Composer, mensagens, estados e responsividade"
        status: done
        acceptance_criteria:
          - "Composer identificado, sugestões, Shift+Enter/IME, histórico limitado e memória por uid."
          - "Loading/error/offline com cancelamento e preservação de texto; retry não duplica pergunta."
          - "Foco/aria-live e composer adaptável ao viewport."
        evidence:
          - "M1_EVIDENCE.md: 4 cenários E2E cobertos (3 PASS + repetição focal 1 PASS); build/typechecks/lint/93 unit PASS."
        dependencies: [M1-T1]
        owner: frontend
        mutation_scope: "UI Gika + testes"
      - id: M1-T3
        title: "Mock adapter sem IA real"
        status: done
        evidence: ["M1_EVIDENCE.md: 101 unit, 12 E2E + Axe, lint/build/typechecks PASS; screenshots revisados."]
        acceptance_criteria: ["Mock determinístico cancelável, saída validada, nenhuma consulta/mutação real; isolamento por conta e falhas testados."]
        dependencies: [M1-T2]
        owner: frontend
        mutation_scope: "Gika adapter + testes"

      - id: M1-T4
        title: "Refinement visual e estrutural solicitado pelo usuário"
        status: done
        evidence:
          - "M1_EVIDENCE.md: lint/build/typechecks, 102 unit, 28 integração, 13 Gika E2E + Axe, 13 shell e 7 sazonal PASS; Planner 4 falhas na regressão ampliada, comparação com base e repetição offline registradas."
        dependencies: [M1-T3]
        owner: frontend
        mutation_scope: "UI Gika, mock, testes e evidências"
        acceptance_criteria:
          - "Conversation viewport independente, empty state, símbolo próprio, chips com ícones e composer expansível fixo com envio interno."
          - "Voz apenas visual; mensagens, loading, erro, tool result, confirmação e undo exclusivamente simulados."
          - "Polimento final: aviso discreto, empty state útil, composer leve, título mobile menor e quick actions inicialmente visíveis."
          - "Gates M1, desktop/mobile, temas, solid, 200%, safe areas e acessibilidade aprovados antes do checkpoint."

  M2:
    name: "Gika read-only"
    status: done
    evidence: "M2_EVIDENCE.md: T1/T2/T3 e smoke real E01/E02 PASS/HTTP200; NETWORK / ENV_PROXY_NOT_ENABLED é configuração do Codex Remote, proxy/egress habilitado somente no subprocesso; arquitetura/produção inalteradas, M3-T1 todo; fechamento final lint/build/typechecks/134 unit e grafo/diff/segredos PASS."
    tasks:
      - id: M2-S0
        title: "Classificar falhas Planner e intermitência antes do adapter"
        status: done
        evidence: ["M2_PREFLIGHT.md e m2-planner-hit-test.json: regressão de dock corrigida, 2 Planner + 3 Gika E2E e lint/build/102 unit PASS."]
        dependencies: [M1-T4]
        owner: qa
        mutation_scope: "evidências/estado e correção de dock Gika demonstrada por comparação local"
        acceptance_criteria: ["Classificação sustentada por prova reproduzível em base e branch atual, sem atribuição ambígua."]
      - id: M2-T1
        title: "Adapter de modelo e configuração"
        status: done
        evidence: ["M2_EVIDENCE.md: lint/build/typechecks e 116 unit PASS; falhas/limites/privacidade do adapter sem segredo."]
        acceptance_criteria: ["Modelo explícito, medium, interface sem persistência e variável somente servidor; falhas requeridas testadas sem chave/billing/fallback pago."]
        dependencies: [M1-T4, M2-S0]
        owner: ai-integration
      - id: M2-T2
        title: "Tools get_today/get_day/get_week"
        status: done
        evidence: ["M2_EVIDENCE.md: 126 unit, 41 integração, 14 Gika mock + 4 UI read-only E2E/Axe PASS; nenhuma mutação."]
        acceptance_criteria: ["Três leituras autenticadas, allowlist/policy/limites/contexto trusted e partial honestos; contrato de UI dos mocks preservado, nenhuma escrita."]
        dependencies: [M2-T1]
        owner: ai-integration
      - id: M2-T3
        title: "Evals read-only e fallback"
        status: done
        evidence: ["M2_EVIDENCE.md/EVALS.md: 134 unit, 42 integração e 8 E2E finais PASS; bloqueio histórico do smoke posteriormente resolvido em M2-SMOKE, sem skipped."]
        acceptance_criteria: ["Evals determinísticos E01/E02/E60/E70 e isolamento/partial/malformed/cancelamento; gates e revisão de escopo concluídos, limite de prova real explícito."]
        dependencies: [M2-T2]
        owner: qa

      - id: M2-SMOKE
        title: "Smoke Gemini real Free Tier (E01/E02)"
        status: done
        dependencies: [M2-T3]
        owner: qa
        evidence: ["2026-10-01: diagnóstico sanitizado HTTP200 com proxy; smoke existente repetido com NODE_USE_ENV_PROXY=1 somente no subprocesso Codex Remote PASS/exit0, E01/E02; sem alteração de produção. M2_EVIDENCE.md."]
        acceptance_criteria: ["Modelo estável/medium interpretam E01/E02 pelo adapter real, nenhum acesso/mutação de agenda; registrar prova e checkpoint sem segredo."]

  M3:
    name: "Primeira mutação segura"
    status: in_progress
    evidence: "M3-T1 e M3-T2 concluídos; M3_T2_EVIDENCE.md. Milestone parcial; M3-T3 concluído; M3-SMOKE bloqueado até revisão, sem live/M4."
    tasks:
      - id: M3-T1
        title: "create_task via command layer existente"
        status: done
        evidence: ["M3_T1_EXECPLAN.md/M3_T1_EVIDENCE.md: PRE92cc9c7 limpo, auditoria command layer, lint/typechecks/build/175 unit/53 integração PASS; 25 E2E Gika (5 criação real), baseline12 falhas local e1 shell classificadas; UI structured após receipt, parada antes de T2/T3."]
        acceptance_criteria: ["Criação simples explicitamente solicitada, schemas strict, data civil determinística e autorização fresca; bridge único sendCommand/activity.create, sucesso estruturado somente após ack, testes/evals/gates e parada antes de T2."]
        dependencies: [M2-T3, M2-SMOKE]
        owner: ai-integration
      - id: M3-T2
        title: "Idempotência básica e duplicate protection"
        status: done
        evidence: ["M3_T2_EXECPLAN.md/M3_T2_EVIDENCE.md: PREa9aff2f limpo, receipt/outbox auditados, ADR012, lint/dois typechecks/build/184 unit/64 integração PASS;27 E2E Gika global e13 finais PASS;58 locais46 PASS/12 FAIL baseline;check12/1 e audit13 vulnerabilidades baseline comparados;parar antes de T3."]
        acceptance_criteria: ["requestId do sistema ligado a operationId/entityId por UID;receipt existente atômico com snapshot/hash mínimo;replay/concurrency/lost response no máximo uma criação;novo ID com conteúdo igual permitido;outro UID isolado e payload diferente conflita;schemas strict/auth fresca/evals,gates,checkpoint e worktree limpo."]
        dependencies: [M3-T1]
        owner: domain
      - id: M3-T3
        title: "Undo seguro da criação Gika pelo comando existente"
        status: done
        dependencies: [M3-T2]
        owner: domain
        acceptance_criteria:
          - "Ação UI determinística, UID original/operation/entity exatos/revisão1/createdAt original; nenhuma chamada Gemini nem target por conteúdo."
          - "activity.trash soft-delete30dias existente; validação/auth/policy/receipt original transacionais, sem purge/revision refresh/writer paralelo."
          - "Receipts existentes tornam replay/concurrency/lost response seguros; edições/remoção/reuso ID posteriores claros sem perda de dados."
          - "UI pending/success/error/conflict somente após ack; auth/logout/conta/falhas/cancelamento cobertos, humanizer/a11y/mobile/dark."
          - "Testes/evals/gates/evidências/checkpoint limpo; parar antes do smoke live/M4, M3 não done."
        evidence: ["M3_T3_EXECPLAN.md/M3_T3_EVIDENCE.md; ADR013; lint/dois TS/build/194 unit/76 integração/6 E2E finais PASS;63 amplos50/13 baseline incluindo timer comprovadofc30bf9;check12/1 e audit13 baseline;checkpoint atômico/clean."]

      - id: M3-SMOKE
        title: "Smoke real da cadeia completa create_task após revisão T3"
        status: blocked
        dependencies: [M3-T3]
        owner: qa
        evidence: ["Aguardar revisão/autorização e credencial atual; Gemini live proibido nesta tarefa."]
        acceptance_criteria: ["Após revisão T3, smoke real linguagem natural/create_task/persistência/resultado com credencial atual autorizada, Free Tier/R$0; gates e evidência sanitizada antes de fechar M3."]

